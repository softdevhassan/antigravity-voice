<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded plate -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle ambient glow circle -->
  <circle cx="64" cy="56" r="32" fill="url(#glowGrad)" filter="url(#neonGlow)" opacity="0.4"/>

  <!-- Microphone capsule -->
  <rect x="52" y="30" width="24" height="42" rx="12" fill="url(#primaryGrad)" filter="url(#neonGlow)"/>
  
  <!-- Capsule highlight slit -->
  <line x1="58" y1="42" x2="70" y2="42" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="58" y1="48" x2="70" y2="48" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Microphone cradle arc -->
  <path d="M42 54 C42 70 52 78 64 78 C76 78 86 70 86 54" fill="none" stroke="url(#primaryGrad)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Stem & Base -->
  <line x1="64" y1="78" x2="64" y2="94" stroke="url(#primaryGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M48 94 L80 94" fill="none" stroke="url(#primaryGrad)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Pulse soundwaves right & left -->
  <path d="M30 46 C24 53 24 67 30 74" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M98 46 C104 53 104 67 98 74" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M22 38 C14 48 14 72 22 82" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M106 38 C114 48 114 72 106 82" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>